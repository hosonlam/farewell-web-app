<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#3d0719">
    <meta name="color-scheme" content="dark">
    <title>Một bất ngờ nhỏ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,600;1,500;1,600&subset=vietnamese&display=swap">
    <style>
        :root {
            --wine: #3d0719;
            --gold: #ffd36b;
            --cream: #fff3dc;
            --ink: #3a1b1f;
            --mut: #8a6560;
            --display: "Playfair Display", Georgia, "Times New Roman", serif;
            --serif: "Lora", Georgia, "Times New Roman", serif;
            --hand: "Charm", "Segoe Script", "Bradley Hand", cursive;
            --sans: "Lora", Georgia, serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--wine);
            color: var(--cream);
            font-family: var(--sans);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none
        }

        button {
            font: inherit;
            color: inherit
        }

        /* ---------- background: wine-red + orange swirl ---------- */
        .bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #3d0719
        }

        .bg i {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 170vmax;
            height: 170vmax;
            margin: -85vmax 0 0 -85vmax;
            will-change: transform
        }

        .bg i:nth-child(1) {
            background:
                radial-gradient(circle at 28% 30%, #f07a2a 0, transparent 30%),
                radial-gradient(circle at 74% 38%, #b01f45 0, transparent 34%),
                radial-gradient(circle at 56% 80%, #ff9a3c 0, transparent 26%),
                radial-gradient(circle at 18% 72%, #7a1032 0, transparent 36%);
            animation: rot 46s linear infinite
        }

        .bg i:nth-child(2) {
            opacity: .75;
            background:
                radial-gradient(circle at 70% 24%, #ffb25a 0, transparent 22%),
                radial-gradient(circle at 30% 58%, #d03a4a 0, transparent 30%),
                radial-gradient(circle at 80% 76%, #8c1638 0, transparent 32%);
            animation: rot 70s linear infinite reverse
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(35, 3, 16, .62) 100%)
        }

        @keyframes rot {
            to {
                transform: rotate(360deg)
            }
        }

        /* ---------- balloons ---------- */
        .bl {
            position: fixed;
            left: var(--x);
            bottom: -120px;
            width: calc(46px*var(--s));
            height: calc(56px*var(--s));
            z-index: 2;
            pointer-events: none;
            animation: rise var(--d) linear var(--dl) infinite;
            opacity: .9;
            will-change: transform
        }

        .bl b {
            position: absolute;
            inset: 0;
            border-radius: 50% 50% 48% 48%/56% 56% 44% 44%;
            animation: sway 5s ease-in-out infinite alternate;
            background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .85) 0, var(--c) 38%, rgba(40, 0, 20, .45) 135%)
        }

        .bl b::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -5px;
            margin-left: -5px;
            border: 5px solid transparent;
            border-bottom: 7px solid var(--c);
            border-top: 0
        }

        .bl b::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            width: 1px;
            height: calc(70px*var(--s));
            background: linear-gradient(rgba(255, 255, 255, .5), transparent)
        }

        @keyframes rise {
            from {
                transform: translate3d(0, 0, 0)
            }

            to {
                transform: translate3d(0, -135vh, 0)
            }
        }

        @keyframes sway {
            from {
                transform: translateX(-14px) rotate(-4deg)
            }

            to {
                transform: translateX(14px) rotate(4deg)
            }
        }

        canvas {
            display: block
        }

        #cv {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            opacity: 0;
            pointer-events: none;
            transition: opacity .9s
        }

        body[data-p=gift] #cv {
            opacity: 1
        }

        #fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none
        }

        /* ---------- scenes ---------- */
        .scr {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .8s, visibility 0s .8s
        }

        body[data-p=intro] #s1 .lead {
            animation: up 1s .2s both
        }

        body[data-p=intro] #s1 h1 {
            animation: up 1.1s .45s both
        }

        body[data-p=intro] #s1 .orbw {
            animation: orbIn 1.3s .8s cubic-bezier(.2, 1.3, .4, 1) both
        }

        body[data-p=intro] #s1 .hold {
            animation: fade 1s 1.7s both
        }

        @keyframes orbIn {
            from {
                opacity: 0;
                transform: scale(.4)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        body[data-p=intro] #s1,
        body[data-p=reveal] #s2,
        body[data-p=gift] #s3 {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity .9s
        }

        .hand {
            font-family: var(--hand);
            font-weight: 700
        }

        /* intro */
        #s1 h1 {
            font-family: var(--display);
            font-style: italic;
            font-weight: 500;
            font-size: clamp(28px, 7vw, 50px);
            line-height: 1.28;
            letter-spacing: -.005em;
            margin: 0 0 4vh;
            max-width: 15em;
            text-wrap: balance;
            text-shadow: 0 3px 22px rgba(30, 0, 15, .55)
        }

        #s1 .lead {
            font-family: var(--hand);
            font-weight: 700;
            font-size: clamp(20px, 4.8vw, 28px);
            line-height: 1.4;
            color: var(--gold);
            margin: 0 0 10px
        }

        .orbw {
            position: relative;
            width: min(64vw, 260px);
            aspect-ratio: 1;
            touch-action: none;
            --g: 0
        }

        .float {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            animation: bob 4.2s ease-in-out infinite
        }

        @keyframes bob {
            50% {
                transform: translateY(-12px)
            }
        }

        .ring {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            filter: drop-shadow(0 0 6px rgba(255, 211, 107, .9))
        }

        .ring .dash {
            transform-origin: 100px 100px;
            animation: rot 28s linear infinite
        }

        .orb {
            position: relative;
            width: 70%;
            aspect-ratio: 1;
            border: 0;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
            touch-action: none;
            outline-offset: 8px;
            background: radial-gradient(circle at 34% 26%, #fffbd2 0, #ffdc68 34%, #f6a824 70%, #d9780f 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3), inset 0 -16px 28px rgba(190, 90, 0, .5),
                0 0 calc(60px + var(--g)*50px) calc(12px + var(--g)*14px) rgba(255, 190, 70, calc(.5 + var(--g)*.35)),
                0 0 170px 44px rgba(255, 140, 40, .28);
            display: grid;
            place-items: center;
            will-change: transform
        }

        .face {
            width: 68%;
            height: 68%;
            overflow: visible;
            margin-top: 2%
        }

        .face .eye {
            transform-box: fill-box;
            transform-origin: center;
            animation: blink 5s infinite
        }

        @keyframes blink {

            0%,
            94%,
            100% {
                transform: scaleY(1)
            }

            97% {
                transform: scaleY(.1)
            }
        }

        .hold {
            margin-top: 5vh;
            min-height: 1.6em;
            font-family: var(--serif);
            font-style: italic;
            font-size: 17px;
            letter-spacing: .01em;
            color: rgba(255, 243, 220, .85);
            transition: opacity .3s
        }

        /* reveal */
        #s2 .r1 {
            font-size: clamp(28px, 7vw, 42px);
            line-height: 1.4;
            color: var(--gold);
            opacity: 0
        }

        #s2 .r2 {
            font-family: var(--serif);
            font-style: italic;
            font-size: clamp(18px, 4.6vw, 24px);
            margin: 10px 0 2px;
            opacity: 0
        }

        #s2 .rn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            justify-content: center;
            margin: 6px 0
        }

        #s2 .rn i {
            flex: 1;
            max-width: 110px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold));
            opacity: 0
        }

        #s2 .rn i:last-child {
            transform: scaleX(-1)
        }

        #s2 .rn b {
            font-family: var(--display);
            font-style: italic;
            font-weight: 600;
            font-size: calc(min(18vw, 124px)*var(--k, 1));
            line-height: 1.25;
            padding: .08em .1em;
            color: #ffe6a8;
            opacity: 0;
            max-width: 100%;
            overflow-wrap: anywhere;
            text-shadow: 0 0 28px rgba(255, 211, 107, .8), 0 0 80px rgba(255, 150, 50, .55)
        }

        #s2 .r3 {
            font-family: var(--serif);
            font-style: italic;
            font-size: 15px;
            opacity: 0;
            margin-top: 14px;
            color: rgba(255, 243, 220, .78)
        }

        body[data-p=reveal] #s2 .r1 {
            animation: up 1.1s .6s both
        }

        body[data-p=reveal] #s2 .r2 {
            animation: up 1.1s 1.3s both
        }

        body[data-p=reveal] #s2 .rn i {
            animation: fade 1.2s 2.1s both
        }

        body[data-p=reveal] #s2 .rn b {
            animation: nm 1.8s 1.9s cubic-bezier(.2, .8, .2, 1) both, glow 3.2s 3.7s ease-in-out infinite
        }

        body[data-p=reveal] #s2 .r3 {
            animation: up 1.1s 3.3s both
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(16px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes fade {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes nm {
            from {
                opacity: 0;
                filter: blur(18px);
                transform: scale(.6)
            }

            55% {
                opacity: 1;
                filter: blur(0)
            }

            to {
                opacity: 1;
                filter: blur(0);
                transform: none
            }
        }

        @keyframes glow {
            50% {
                text-shadow: 0 0 40px rgba(255, 225, 140, 1), 0 0 110px rgba(255, 150, 50, .8)
            }
        }

        /* gift */
        #s3 {
            justify-content: flex-start;
            padding-top: max(7vh, calc(env(safe-area-inset-top) + 24px));
            z-index: 7
        }

        #s3 .a {
            font-family: var(--hand);
            font-weight: 700;
            font-size: clamp(26px, 6.6vw, 36px);
            line-height: 1.4;
            color: var(--gold);
            transition: opacity .6s
        }

        #s3 .b {
            font-family: var(--serif);
            font-style: italic;
            font-size: clamp(16px, 4vw, 20px);
            margin-top: 2px;
            opacity: .85;
            transition: opacity .6s
        }

        #s3.opened .a,
        #s3.opened .b {
            opacity: 0
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(env(safe-area-inset-bottom) + 8vh);
            text-align: center;
            z-index: 8;
            pointer-events: none;
            font-family: var(--serif);
            font-style: italic;
            font-size: 17px;
            color: rgba(255, 243, 220, .9);
            opacity: 0;
            transition: opacity .6s
        }

        #hint.on {
            opacity: 1;
            animation: blink2 2.2s ease-in-out infinite
        }

        @keyframes blink2 {
            50% {
                opacity: .45
            }
        }

        #fb {
            position: fixed;
            left: 50%;
            top: 50%;
            width: min(70vw, 300px);
            transform: translate(-50%, -44%);
            z-index: 7;
            cursor: pointer;
            opacity: 0;
            transition: opacity .8s
        }

        body[data-p=gift] #fb {
            opacity: 1
        }

        #fb svg {
            width: 100%;
            overflow: visible;
            animation: bob 3.6s ease-in-out infinite
        }

        #fbLid {
            transition: transform 1s cubic-bezier(.2, .9, .3, 1.1), opacity .8s .3s
        }

        #fb.open #fbLid {
            transform: translate(40px, -150px) rotate(24deg);
            opacity: 0
        }

        #end {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(env(safe-area-inset-bottom) + 6vh);
            z-index: 9;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            opacity: 0;
            visibility: hidden;
            transition: opacity .8s, visibility 0s .8s
        }

        #end.on {
            opacity: 1;
            visibility: visible;
            transition: opacity .8s
        }

        #end p {
            margin: 0;
            font-family: var(--hand);
            font-weight: 700;
            font-size: clamp(26px, 6.4vw, 34px);
            line-height: 1.4;
            color: var(--gold)
        }

        #flash {
            position: fixed;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at 50% 52%, #fff 0, #fff1c8 35%, #ffb866 100%)
        }

        #flash.on {
            opacity: 1;
            transition: opacity .22s ease-out
        }

        #flash.off {
            opacity: 0;
            transition: opacity 1.4s ease-out
        }

        /* ---------- letter ---------- */
        .veil {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            padding: max(28px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
            background: rgba(32, 3, 16, .5);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px)
        }

        .veil.show {
            display: flex;
            animation: fade .5s both
        }

        .veil.hide {
            animation: fade .5s .25s reverse both
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 470px;
            opacity: 0;
            will-change: transform
        }

        .paper {
            position: relative;
            max-height: calc(100dvh - 96px);
            max-height: calc(100svh - 96px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            -webkit-user-select: text;
            user-select: text;
            color: var(--ink);
            padding: 56px 34px 30px;
            border-radius: 16px;
            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .38 0 0 0 0 .2 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
                radial-gradient(ellipse at 50% 0%, #fffdf6 0, transparent 70%), linear-gradient(180deg, #fff8ec, #fbecd6);
            box-shadow: 0 34px 90px rgba(20, 0, 10, .6), 0 0 100px rgba(255, 190, 90, .3), inset 0 0 0 8px #fff8ec, inset 0 0 0 9px rgba(185, 135, 75, .4), inset 0 0 40px rgba(190, 130, 60, .16)
        }

        .seal {
            position: absolute;
            left: 50%;
            top: -28px;
            width: 58px;
            height: 58px;
            margin-left: -29px;
            z-index: 2;
            filter: drop-shadow(0 5px 7px rgba(60, 0, 10, .45));
            opacity: 0
        }

        .veil.show .seal {
            animation: stamp .7s .55s cubic-bezier(.3, 1.6, .5, 1) both
        }

        @keyframes stamp {
            from {
                opacity: 0;
                transform: scale(1.9) rotate(-25deg)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .paper h2 {
            font-family: var(--hand);
            font-weight: 700;
            font-size: clamp(34px, 8.6vw, 44px);
            line-height: 1.35;
            margin: 0 0 14px;
            color: #8a1830
        }

        .paper p {
            font-family: var(--serif);
            font-size: clamp(16.5px, 4.3vw, 18px);
            line-height: 1.8;
            margin: 0 0 14px;
            max-width: 34em;
            color: #3d2226
        }

        .paper .l {
            opacity: 0;
            animation: up .9s cubic-bezier(.2, .8, .2, 1) both
        }

        .paper .ink {
            animation: ink 1.4s cubic-bezier(.45, .05, .3, 1) both
        }

        @keyframes ink {
            from {
                clip-path: inset(-20% 100% -20% 0);
                opacity: 1
            }

            to {
                clip-path: inset(-20% -2% -20% 0);
                opacity: 1
            }
        }

        .paper .sign {
            font-family: var(--hand);
            font-weight: 700;
            font-size: clamp(30px, 7.4vw, 38px);
            line-height: 1.35;
            margin: 24px 0 4px;
            text-align: right;
            color: #8a1830
        }

        .paper .sign.ink {
            animation-name: inkR
        }

        @keyframes inkR {
            from {
                clip-path: inset(-20% 100% -20% 0);
                opacity: 1
            }

            to {
                clip-path: inset(-20% -2% -20% 0);
                opacity: 1
            }
        }

        .paper .contact {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(138, 24, 48, .2)
        }

        .paper .contact p {
            font-size: 15px;
            line-height: 1.7;
            color: var(--mut);
            margin-bottom: 6px;
            font-style: italic
        }

        .paper .contact p:last-child {
            color: var(--ink);
            font-style: normal;
            font-weight: 500
        }

        .btn {
            display: inline-block;
            border: 0;
            border-radius: 999px;
            padding: 13px 30px;
            font-family: var(--serif);
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(180deg, #f0634f, #d6353f);
            color: #fff;
            box-shadow: 0 8px 22px rgba(120, 10, 30, .4);
            touch-action: manipulation
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn.ghost {
            background: rgba(255, 255, 255, .14);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4)
        }

        .paper .btnrow {
            text-align: center;
            margin-top: 22px
        }

        :focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px
        }

        @media (prefers-reduced-motion:reduce) {

            .bg i,
            .bl,
            .bl b,
            .ring .dash {
                animation: none
            }

            .float,
            #fb svg {
                animation: none
            }
        }
    </style>
</head>

<body data-p="load">
    <div class="bg"><i></i><i></i></div>
    <div id="balloons" aria-hidden="true"></div>
    <canvas id="cv"></canvas>

    <section class="scr" id="s1" aria-live="polite">
        <p class="lead" id="lead"></p>
        <h1 id="h1"></h1>
        <div class="orbw" id="orbw">
            <div class="float">
                <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
                    <circle class="dash" cx="100" cy="100" r="98" fill="none" stroke="rgba(255,255,255,.28)"
                        stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round" />
                    <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="4" />
                    <circle id="pr" cx="100" cy="100" r="94" fill="none" stroke="#ffd36b" stroke-width="5"
                        stroke-linecap="round" stroke-dasharray="591" stroke-dashoffset="591"
                        transform="rotate(-90 100 100)" />
                </svg>
                <button class="orb" id="orb" aria-label="Nhấn giữ để mở quà">
                    <svg class="face" viewBox="0 0 100 100" aria-hidden="true">
                        <ellipse cx="37" cy="20" rx="14" ry="8.5" fill="#ffc93c" transform="rotate(-20 37 20)" />
                        <ellipse cx="63" cy="20" rx="14" ry="8.5" fill="#ffc93c" transform="rotate(20 63 20)" />
                        <circle cx="50" cy="25" r="6" fill="#e3a312" />
                        <rect x="14" y="27" width="72" height="62" rx="24" fill="#ef5a4a" />
                        <rect x="14" y="27" width="72" height="30" rx="24" fill="#ff7b66" opacity=".45" />
                        <g class="eye">
                            <circle cx="36" cy="56" r="4.4" fill="#4a1a1a" />
                            <circle cx="37.6" cy="54.4" r="1.4" fill="#fff" />
                        </g>
                        <g class="eye">
                            <circle cx="64" cy="56" r="4.4" fill="#4a1a1a" />
                            <circle cx="65.6" cy="54.4" r="1.4" fill="#fff" />
                        </g>
                        <ellipse cx="26" cy="67" rx="5.4" ry="3.6" fill="#ffa090" />
                        <ellipse cx="74" cy="67" rx="5.4" ry="3.6" fill="#ffa090" />
                        <path d="M41 66q9 10 18 0" fill="none" stroke="#4a1a1a" stroke-width="3.4"
                            stroke-linecap="round" />
                    </svg>
                </button>
